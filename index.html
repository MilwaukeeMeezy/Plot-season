<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plot & Season</title>
  <link rel="stylesheet" href="./styles.css?v=20260828-1614" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="startup-error" style="display:none;padding:20px;font-family:Arial;color:#7a1d1d;background:#fff3f3;border:2px solid #c77;margin:20px">
    <b>Plot & Season could not start.</b>
    <div id="startup-error-text" style="margin-top:8px;white-space:pre-wrap"></div>
  </div>
  <script src="./startup.js"></script>
  <script>
    // Load rank tracking before app.js so it can observe real gameplay state.
    const rankScript = document.createElement('script');
    rankScript.src = './gardener-ranks.js?v=' + Date.now();
    rankScript.onload = function () {
      const plotSeasonScript = document.createElement('script');
      plotSeasonScript.src = './app.js?v=' + Date.now();
      document.body.appendChild(plotSeasonScript);
    };
    document.body.appendChild(rankScript);

    function plotSeasonRankSnapshot() {
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem('plotandseason-gardener-ranks-v1') || '{}');
      } catch (e) { saved = {}; }
      const goals = saved.gardenGoals || {};
      const history = Array.isArray(saved.seasonHistory) ? saved.seasonHistory : [];
      const count = (min) => history.filter((s) => s && Number(s.harvestCount) > 0 && Number(s.minimumHealth) >= min).length;
      const planted = !!saved.planted;
      const ranks = [
        { id:'seed', icon:'🌱', name:'Seed Starter' },
        { id:'grower', icon:'🪴', name:'Grower' },
        { id:'hobbyist', icon:'🌿', name:'Hobbyist / Cultivator' },
        { id:'gardener', icon:'🌻', name:'Gardener' },
        { id:'master', icon:'🏅', name:'Master Gardener' }
      ];
      let idx = 0;
      if (planted && Number(goals.plantsWatered || 0) >= 5 && Number(goals.harvests || 0) >= 3) idx = 1;
      if (count(60) >= 1) idx = 2;
      if (count(70) >= 2) idx = 3;
      if (count(80) >= 3) idx = 4;
      let progress = 'Begin your garden journey';
      if (idx === 0) {
        const parts = (planted ? 1 : 0) + Math.min(Number(goals.plantsWatered || 0), 5) / 5 + Math.min(Number(goals.harvests || 0), 3) / 3;
        progress = Math.round(parts / 3 * 100) + '% to Grower';
      } else if (idx === 1) progress = Math.min(count(60), 1) + '/1 season at 60%+';
      else if (idx === 2) progress = Math.min(count(70), 2) + '/2 seasons at 70%+';
      else if (idx === 3) progress = Math.min(count(80), 3) + '/3 seasons at 80%+';
      else progress = 'Highest rank achieved';
      return { rank: ranks[idx], progress };
    }

    function ensureGardenerRankBadge() {
      // Remove the old floating rank badge so there is only one rank display.
      const legacyBadge = document.getElementById('gardener-rank-badge');
      if (legacyBadge) legacyBadge.remove();

      const navButtons = Array.from(document.querySelectorAll('button'));
      const gameVisible = navButtons.some((b) => (b.textContent || '').includes('Garden Journey')) &&
                          navButtons.some((b) => (b.textContent || '').includes('Yard'));
      let badge = document.getElementById('gardener-rank-badge-guaranteed');
      if (!gameVisible) {
        if (badge) badge.remove();
        return;
      }
      if (!badge) {
        badge = document.createElement('button');
        badge.id = 'gardener-rank-badge-guaranteed';
        badge.type = 'button';
        badge.title = 'Open Garden Journey';
        Object.assign(badge.style, {
          position:'fixed',
          top:'10px',
          left:'50%',
          transform:'translateX(-50%)',
          zIndex:'220',
          minWidth:'210px',
          padding:'2px 14px 4px',
          border:'0',
          borderRadius:'0',
          background:'transparent',
          color:'#F3E6C9',
          boxShadow:'none',
          textAlign:'center',
          cursor:'pointer',
          fontFamily:'inherit'
        });
        badge.onclick = function () {
          const journey = Array.from(document.querySelectorAll('button')).find((b) => (b.textContent || '').includes('Garden Journey'));
          if (journey) journey.click();
        };
        document.body.appendChild(badge);
      }
      const snap = plotSeasonRankSnapshot();
      badge.innerHTML = '<div style="font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#CDBB99">Gardener Rank</div>' +
        '<div style="font-size:14px;font-weight:900;line-height:1.2;margin-top:1px;color:#F3E6C9">' + snap.rank.icon + ' ' + snap.rank.name + '</div>' +
        '<div style="font-size:8px;color:#CDBB99;margin-top:1px">' + snap.progress + '</div>';
    }

    setInterval(ensureGardenerRankBadge, 700);
  </script>
</body>
</html>
