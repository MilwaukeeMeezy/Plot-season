<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plot & Season</title>
  <link rel="stylesheet" href="./styles.css?v=20260828-1614" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="startup-error" style="display:none;padding:20px;font-family:Arial;color:#7a1d1d;background:#fff3f3;border:2px solid #c77;margin:20px">
    <b>Plot & Season could not start.</b>
    <div id="startup-error-text" style="margin-top:8px;white-space:pre-wrap"></div>
  </div>
  <script src="./startup.js"></script>
  <script>
    // Load rank tracking before app.js so it can observe real gameplay state.
    // gardener-ranks.js is the single owner of the rank display and its placement.
    const rankScript = document.createElement('script');
    rankScript.src = './gardener-ranks.js?v=' + Date.now();
    rankScript.onload = function () {
      const plotSeasonScript = document.createElement('script');
      plotSeasonScript.src = './app.js?v=' + Date.now();
      document.body.appendChild(plotSeasonScript);
    };
    document.body.appendChild(rankScript);
  </script>
</body>
</html>
