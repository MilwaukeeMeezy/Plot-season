<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plot & Season</title>
  <link rel="stylesheet" href="./styles.css?v=20260828-1614" />
  <style>
    /* The rank tracker may briefly recreate its badge during React re-renders.
       Keep any unanchored copy invisible so only the header-owned copy can ever show. */
    #gardener-rank-badge { visibility: hidden !important; }
    #gardener-rank-badge[data-header-anchored="true"] { visibility: visible !important; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="startup-error" style="display:none;padding:20px;font-family:Arial;color:#7a1d1d;background:#fff3f3;border:2px solid #c77;margin:20px">
    <b>Plot & Season could not start.</b>
    <div id="startup-error-text" style="margin-top:8px;white-space:pre-wrap"></div>
  </div>
  <script src="./startup.js"></script>
  <script>
    // Load rank tracking before app.js so it can observe real gameplay state.
    const rankScript = document.createElement('script');
    rankScript.src = './gardener-ranks.js?v=' + Date.now();
    rankScript.onload = function () {
      const plotSeasonScript = document.createElement('script');
      plotSeasonScript.src = './app.js?v=' + Date.now();
      document.body.appendChild(plotSeasonScript);
    };
    document.body.appendChild(rankScript);

    // The rank tracker owns the content; this code owns where that one badge is allowed to appear.
    function anchorGardenerRankInHeader() {
      const obsolete = document.getElementById('gardener-rank-badge-guaranteed');
      if (obsolete) obsolete.remove();

      const badges = Array.from(document.querySelectorAll('#gardener-rank-badge'));
      if (!badges.length) return;

      const buttons = Array.from(document.querySelectorAll('button'));
      const saveButton = buttons.find((button) => (button.textContent || '').trim().includes('Save'));
      if (!saveButton || !saveButton.parentElement || !saveButton.parentElement.parentElement) return;

      const topBarRight = saveButton.parentElement;
      const topBarMainRow = topBarRight.parentElement;
      topBarMainRow.style.position = 'relative';

      // Keep exactly one copy. Any tracker-created extras are removed before they can become visible.
      const badge = badges[0];
      badges.slice(1).forEach((extra) => extra.remove());

      if (badge.parentElement !== topBarMainRow) {
        badge.dataset.headerAnchored = 'false';
        topBarMainRow.appendChild(badge);
      }

      Object.assign(badge.style, {
        position: 'absolute',
        top: '50%',
        left: '50%',
        right: 'auto',
        transform: 'translate(-50%, -50%)',
        zIndex: '2',
        minWidth: '210px',
        padding: '2px 14px 4px',
        margin: '0',
        border: '0',
        borderRadius: '0',
        background: 'transparent',
        color: '#F3E6C9',
        boxShadow: 'none',
        textAlign: 'center',
        cursor: 'pointer',
        fontFamily: 'inherit',
        lineHeight: '1.1'
      });
      badge.dataset.headerAnchored = 'true';
    }

    setInterval(anchorGardenerRankInHeader, 100);
  </script>
</body>
</html>
