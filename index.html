<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plot & Season</title>
  <link rel="stylesheet" href="./styles.css?v=20260828-2100" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div id="ambient-bg" aria-hidden="true"></div>
  <div id="root"></div>
  <div id="startup-error" style="display:none;padding:20px;font-family:Arial;color:#7a1d1d;background:#fff3f3;border:2px solid #c77;margin:20px">
    <b>Plot & Season could not start.</b>
    <div id="startup-error-text" style="margin-top:8px;white-space:pre-wrap"></div>
  </div>
  <script src="./startup.js"></script>
  <script>
    // Load gameplay observers before app.js so they can observe real gameplay state.
    const rankScript = document.createElement('script');
    rankScript.src = './gardener-ranks.js?v=' + Date.now();
    rankScript.onload = function () {
      const celebrationScript = document.createElement('script');
      celebrationScript.src = './goal-celebrations.js?v=' + Date.now();
      celebrationScript.onload = function () {
        const challengeScript = document.createElement('script');
        challengeScript.src = './challenge-goals.js?v=' + Date.now();
        challengeScript.onload = function () {
          const journeyDashboardScript = document.createElement('script');
          journeyDashboardScript.src = './journey-dashboard.js?v=' + Date.now();
          journeyDashboardScript.onload = function () {
            const plotSeasonScript = document.createElement('script');
            plotSeasonScript.src = './app.js?v=' + Date.now();
            document.body.appendChild(plotSeasonScript);
          };
          document.body.appendChild(journeyDashboardScript);
        };
        document.body.appendChild(challengeScript);
      };
      document.body.appendChild(celebrationScript);
    };
    document.body.appendChild(rankScript);
  </script>
</body>
</html>
